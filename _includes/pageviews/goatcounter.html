<!-- Display GoatCounter pageviews -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const pv = document.getElementById('pageviews');

    if (pv !== null) {
      const uri = location.pathname.replace(/\/$/, '');
      /* A post may be split across case variants, but GoatCounter falls back to a case-insensitive match when
         a variant has no record, so equal counts mean the same record and are counted once */
      const uris = [...new Set([uri, uri.toLowerCase()])];

      const fetchCount = (path) => {
        const url = `https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/${encodeURIComponent(path)}.json`;

        return fetch(url)
          .then((response) => (response.ok ? response.json() : { count: '0' }))
          .then((data) => Number(data.count.replace(/\D/g, '')))
          .catch(() => 0);
      };

      Promise.all(uris.map(fetchCount)).then((counts) => {
        const count = [...new Set(counts)].reduce((sum, n) => sum + n, 0);
        pv.innerText = new Intl.NumberFormat().format(Math.max(count, 1));
      });
    }
  });
</script>
