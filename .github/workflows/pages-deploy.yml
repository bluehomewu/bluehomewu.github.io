name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Hourly rebuild so embargoed NewsRoom posts appear once their date has passed
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Scheduled runs only rebuild when a post or press release became due in the last hour
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.due.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for newly due posts
        id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, glob, re
          now = datetime.datetime.now(datetime.timezone.utc)
          due = False
          for path in glob.glob("_posts/*.md") + glob.glob("_newsroom/*.md"):
              m = re.search(r"^date:\s*\"?(\d{4}-\d{2}-\d{2} \d{2}:\d{2}(?::\d{2})?)\s*([+-]\d{4})?", open(path, encoding="utf-8").read(), re.M)
              if not m:
                  continue
              fmt = "%Y-%m-%d %H:%M:%S" if m.group(1).count(":") == 2 else "%Y-%m-%d %H:%M"
              dt = datetime.datetime.strptime(m.group(1), fmt).replace(
                  tzinfo=datetime.datetime.strptime(m.group(2) or "+0800", "%z").tzinfo)
              if now - datetime.timedelta(minutes=70) <= dt <= now:
                  due = True
          print(f"build={'true' if due else 'false'}")
          PY

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Sync GitHub Profile README
        run: |
          # 準備好 about.md 需要的 Front Matter
          ABOUT_FRONT_MATTER="---\nicon: fas fa-info-circle\norder: 5\ntitle: About\n---\n\n"
          
          # 下載 README 內容到一個暫存檔案
          curl -s https://raw.githubusercontent.com/bluehomewu/bluehomewu/master/README.md -o ./README_from_profile.md
          
          # 將 Front Matter 和下載的內容合併成最終的 _tabs/about.md
          echo -e "$ABOUT_FRONT_MATTER" > _tabs/about.md
          cat ./README_from_profile.md >> _tabs/about.md

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --no-enforce-https \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
